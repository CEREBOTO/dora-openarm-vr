# ── OpenArm v1 Real Robot Teleoperation with Quest VR ──
# Usage: dora run config/dataflow-real.yaml

nodes:
  - id: quittable-tick-leader
    path: dora-openarm-quitter-local
    inputs:
      tick: dora/timer/millis/20
      command: udp-receiver/button_b
    outputs:
      - tick

  - id: udp-receiver
    path: dora-openarm-quest-receiver
    args: "--host 0.0.0.0 --port 5006"
    inputs:
      tick: quittable-tick-leader/tick
    outputs:
      - pose_right
      - trigger_right
      - pose_left
      - trigger_left
      - joystick_y
      - button_a
      - button_b
      - status

  - id: ik
    path: dora-openarm-ik
    args: "--mode bimanual --max-iters 10 --dt 0.1 --damping 0.1 --posture-cost 0.01 --lm-damping 0.01"
    inputs:
      tick: quittable-tick-leader/tick
      target_right: udp-receiver/pose_right
      target_left:  udp-receiver/pose_left
      trigger_right: udp-receiver/trigger_right
      trigger_left:  udp-receiver/trigger_left
    outputs:
      - position_left
      - position_right
      - status

  - id: follower-right
    path: dora-openarm
    args: "--side right"
    inputs:
      request_state: ik/position_right
      move_position: ik/position_right
    outputs:
      - state
      - status

  - id: follower-left
    path: dora-openarm
    args: "--side left"
    inputs:
      request_state: ik/position_left
      move_position: ik/position_left
    outputs:
      - state
      - status
